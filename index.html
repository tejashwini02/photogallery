
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 25px 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            color: #00d4ff;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover {
            color: #00d4ff;
        }

        .hero {
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .hero h1 {
            font-size: 50px;
            margin-bottom: 20px;
        }

        .hero span {
            color: #00d4ff;
        }

        .hero p {
            font-size: 18px;
            color: #ddd;
            margin-bottom: 30px;
        }

        button {
            padding: 14px 30px;
            border: none;
            border-radius: 30px;
            background: #00d4ff;
            color: #141e30;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: white;
            transform: scale(1.05);
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <header>
        <h2>My Website</h2>

        <nav>
            <a href="#">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Hello, I'm <span>Developer!</span></h1>

        <p>Welcome to my first website using HTML and CSS.</p>

        <p>chitti</p>
        
        <button onclick="showMessage()">
            Click Me
        </button>
    </section>

    <section id="about" style="text-align:center; padding:30px;">
        <h2>About Me</h2>
        <p style="margin-top:15px;">
            I am learning web development and building amazing projects.
        </p>
    </section>

    <section id="contact" style="text-align:center; padding:30px;">
        <h2>Contact Me</h2>
        <p style="margin-top:15px;">Email: example@gmail.com</p>
    </section>

    <footer>
        <p>&copy; 2026 My Website. All Rights Reserved.</p>
    </footer>

    <script>
        function showMessage() {
            alert("Welcome to my website!");
        }
    </script>

</body>
</html>
